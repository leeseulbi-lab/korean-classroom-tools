<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conjugation Quiz · 활용 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e6e8ec; --text:#2f3437; --muted:#767d87;
    --accent:#7d9a86; --accent-soft:#eef3ef;
    --ok:#3f8f6b; --ok-bg:#ecf6f1; --ok-line:#bfe0d0;
    --no:#c25c55; --no-bg:#fbeeed; --no-line:#eecac6;
  }
  body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;padding:24px 16px;line-height:1.55}
  .wrap{max-width:660px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 26px}
  h1{font-size:1.25rem;font-weight:700;text-align:center;margin-bottom:4px}
  .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:24px}
  .block{margin-bottom:20px}
  .block-title{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.04em;
    text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mini{font-size:.7rem;font-weight:500;background:none;border:1px solid var(--line);border-radius:5px;
    padding:2px 8px;cursor:pointer;color:var(--muted);font-family:inherit}
  .mini:hover{border-color:var(--accent);color:var(--accent)}
  .grid{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px;
    font-size:.84rem;font-family:inherit;color:var(--text);cursor:pointer;transition:.15s;text-align:left}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:#3f5c4a;font-weight:500}
  .chip .num{color:var(--muted);font-size:.74rem;margin-left:4px}
  .chip .les{color:var(--muted);font-size:.72rem;margin-right:5px}
  .seg{display:flex;gap:7px;flex-wrap:wrap}
  .seg .chip{flex:1;min-width:120px;text-align:center}
  .info{text-align:center;color:var(--muted);font-size:.85rem;margin:18px 0 14px;min-height:1.3em}
  .info b{color:var(--accent);font-weight:700}
  .btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px;
    font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:#6d8a76}
  .btn:disabled{background:#c9cfda;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--muted);border:1px solid var(--line);font-weight:500;margin-top:10px}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:#fff}
  .bar{background:var(--line);border-radius:3px;height:5px;margin-bottom:8px;overflow:hidden}
  .fill{background:var(--accent);height:100%;transition:width .35s ease}
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-bottom:20px}
  .q{background:var(--accent-soft);border-radius:12px;padding:24px 18px;text-align:center;margin-bottom:18px}
  .q-stem{font-size:2rem;font-weight:700;color:#3c4f43}
  .q-mean{color:#5d7566;font-size:.88rem;margin-top:2px}
  .q-form{display:inline-block;margin-top:12px;background:#fff;border:1px solid #cdddd3;border-radius:7px;
    padding:5px 13px;font-size:1rem;font-weight:700;color:#3c4f43}
  .q-type{font-size:.75rem;color:#6f8878;margin-top:9px;min-height:1.1em}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
  .opt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 11px;font-size:1.02rem;
    font-family:inherit;color:var(--text);cursor:pointer;transition:.15s;text-align:center;word-break:keep-all}
  .opt:hover:not(:disabled){border-color:var(--accent);background:#fafbfa}
  .opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok);font-weight:700}
  .opt.no{background:var(--no-bg);border-color:var(--no-line);color:var(--no)}
  .opt:disabled{cursor:default}
  .typebox{display:flex;gap:8px;margin-bottom:16px}
  .typebox input{flex:1;padding:14px 14px;font-size:1.05rem;font-family:inherit;border:1px solid var(--line);
    border-radius:10px;color:var(--text);background:#fff}
  .typebox input:focus{outline:none;border-color:var(--accent)}
  .typebox button{padding:0 22px;background:var(--accent);color:#fff;border:none;border-radius:10px;
    font-family:inherit;font-weight:700;cursor:pointer}
  .fb{border-radius:10px;padding:14px 16px;margin-bottom:16px;display:none;
    background:var(--ok-bg);border:1px solid var(--ok-line)}
  .fb.bad{background:var(--no-bg);border-color:var(--no-line)}
  .fb-t{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ok);margin-bottom:5px}
  .fb.bad .fb-t{color:var(--no)}
  .fb-m{font-weight:700;margin-bottom:4px}
  .fb-e{font-size:.88rem;color:var(--muted)}
  .score{text-align:center;padding:8px 0 4px}
  .score-n{font-size:3rem;font-weight:700;color:var(--accent);line-height:1}
  .score-d{color:var(--muted);font-size:.9rem;margin-bottom:14px}
  .score-m{font-size:1.15rem;font-weight:700;margin-bottom:6px}
  .score-s{color:var(--muted);font-size:.88rem;margin-bottom:24px}
  .rev-t{font-size:.9rem;font-weight:700;text-align:left;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .rev{background:#fcfcfd;border:1px solid var(--line);border-left:3px solid var(--no-line);
    border-radius:8px;padding:12px 14px;margin-bottom:8px;text-align:left}
  .rev-k{font-size:1.02rem;font-weight:700}
  .rev-e{font-size:.86rem;color:var(--muted);margin-top:3px}
  .allok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok);border-radius:10px;
    padding:14px;font-weight:700;margin-bottom:16px;text-align:center}
  @media(max-width:480px){.card{padding:22px 18px}.choices{grid-template-columns:1fr}}
  .meta .nav{display:flex;align-items:center;gap:6px}
  .meta .nav .mini{font-size:.74rem;padding:3px 9px}
  .src{background:#fff8ea;border:1px solid #f0dfb8;color:#7a5b1e;border-radius:9px;padding:9px 12px;font-size:.84rem;margin-bottom:18px;display:none}
  .src button{margin-left:6px}
  .edit-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .edit-row select,.edit-row input{font-family:inherit;font-size:.92rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
  .edit-row select{flex:1;min-width:180px}
  textarea#words{width:100%;min-height:16rem;font-family:inherit;font-size:.95rem;line-height:1.6;padding:12px;border:1px solid var(--line);border-radius:10px;resize:vertical;color:var(--text)}
  textarea#words:focus,.edit-row select:focus,.edit-row input:focus{outline:none;border-color:var(--accent)}
  .help{font-size:.82rem;color:var(--muted);margin:8px 0 14px}
  .help code{background:var(--accent-soft);border-radius:4px;padding:1px 5px;font-family:inherit;color:#3f5c4a}
  .err{font-size:.84rem;color:var(--no);margin:6px 0;white-space:pre-line}
  .ok-msg{font-size:.84rem;color:var(--ok);margin:6px 0;min-height:1.2em}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btn-row .btn{flex:1;min-width:150px;width:auto;padding:11px;font-size:.92rem}
  .btn.small{padding:9px;font-size:.86rem}
  hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
  .langbar{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
  .langbar .mini{font-size:.76rem;padding:3px 10px}
  .langbar .mini.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
</style>
</head>
<body>
<div class="wrap"><div class="card">

<div id="s-start">
  <div class="langbar" role="group" aria-label="언어 · Language · Langue" id="lang"><button class="mini" type="button" data-lang="ko" lang="ko">한국어</button><button class="mini" type="button" data-lang="en" lang="en">English</button><button class="mini" type="button" data-lang="fr" lang="fr">Français</button></div>
  <h1 data-i18n="title"></h1>
  <div class="sub" data-i18n="sub"></div>
  <div class="src" id="srcNote"></div>

  <div class="block">
    <div class="block-title" data-i18n="mode"></div>
    <div class="seg" id="modeSeg">
      <button class="chip on" data-mode="mc" data-i18n="mc"></button>
      <button class="chip" data-mode="type" data-i18n="type"></button>
    </div>
  </div>

  <div class="block">
    <div class="block-title" data-i18n="questions"></div>
    <div class="seg" id="lenSeg">
      <button class="chip on" data-len="10">10</button>
      <button class="chip" data-len="20">20</button>
      <button class="chip" data-len="30">30</button>
    </div>
  </div>

  <div class="block">
    <div class="block-title" data-i18n="hint"></div>
    <div class="seg" id="hintSeg">
      <button class="chip on" data-hint="1" data-i18n="hintShow"></button>
      <button class="chip" data-hint="0" data-i18n="hintHide"></button>
    </div>
  </div>

  <div class="block">
    <div class="block-title">
      <span data-i18n="forms"></span>
      <button class="mini" id="selAll" data-i18n="selAll"></button>
      <button class="mini" id="selNone" data-i18n="clear"></button>
      <button class="mini" id="editBtn" data-i18n="editBtn"></button>
    </div>
    <div class="grid" id="formGrid"></div>
  </div>

  <div class="info" id="info"></div>
  <button class="btn" id="startBtn" disabled data-i18n="start"></button>
</div>

<div id="s-edit" style="display:none">
  <h1 data-i18n="editTitle"></h1>
  <div class="sub" data-i18n="editSub"></div>

  <div class="edit-row">
    <select id="formSel" data-i18n-aria="formAria"></select>
    <button class="mini" id="addFormBtn" data-i18n="addForm"></button>
    <button class="mini" id="delFormBtn" data-i18n="delForm"></button>
  </div>
  <div class="edit-row" id="newFormRow" style="display:none">
    <input id="newFormName" data-i18n-ph="newFormPh" data-i18n-aria="newFormAria">
    <button class="mini" id="newFormOk" data-i18n="add"></button>
    <button class="mini" id="newFormCancel" data-i18n="cancel"></button>
  </div>

  <textarea id="words" spellcheck="false" data-i18n-aria="wordsAria"></textarea>
  <div class="help" data-i18n-html="help"></div>
  <div class="err" id="editErr"></div>
  <div class="ok-msg" id="editOk"></div>

  <div class="btn-row">
    <button class="btn" id="saveEdit" data-i18n="save"></button>
    <button class="btn ghost small" id="cancelEdit" data-i18n="cancel"></button>
  </div>
  <hr class="sep">
  <div class="block-title" data-i18n="shareH"></div>
  <div class="help" data-i18n="shareHelp"></div>
  <div class="btn-row">
    <button class="btn ghost small" id="copyLink" data-i18n="copyLink"></button>
    <button class="btn ghost small" id="dlData" data-i18n="dlData"></button>
    <button class="btn ghost small" id="resetAll" data-i18n="resetAll"></button>
  </div>
  <div class="ok-msg" id="shareMsg"></div>
</div>

<div id="s-quiz" style="display:none">
  <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>
  <div class="meta"><span class="nav"><button class="mini" id="prevBtn" data-i18n-title="backTitle" data-i18n="back"></button><button class="mini" id="menuBtn" data-i18n-title="menuTitle" data-i18n="menu"></button><span id="counter">1 / 10</span></span><span id="running"></span></div>
  <div class="q">
    <div class="q-stem" id="qStem"></div>
    <div class="q-mean" id="qMean"></div>
    <div class="q-form" id="qForm"></div>
    <div class="q-type" id="qType"></div>
  </div>
  <div class="choices" id="opts"></div>
  <div class="typebox" id="typebox" style="display:none">
    <input id="ansInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="답을 쓰세요">
    <button id="checkBtn" data-i18n="check"></button>
  </div>
  <div class="fb" id="fb">
    <div class="fb-t" id="fbT"></div>
    <div class="fb-m" id="fbM"></div>
    <div class="fb-e" id="fbE"></div>
  </div>
  <button class="btn" id="nextBtn" style="display:none"></button>
</div>

<div id="s-done" style="display:none">
  <div class="score">
    <div class="score-n" id="sN">0</div>
    <div class="score-d" id="sD">/ 10</div>
    <div class="score-m" id="sM"></div>
    <div class="score-s" id="sS"></div>
  </div>
  <div id="revBox"></div>
  <button class="btn" id="againBtn" data-i18n="again"></button>
  <button class="btn ghost" id="backBtn" data-i18n="changeForms"></button>
</div>

</div></div>
<script src="data.js"></script>

var BASE = 0xAC00;
function dec(ch){
  var c = ch.charCodeAt(0) - BASE;
  if (c < 0 || c > 11171) return null;
  return [Math.floor(c/588), Math.floor((c%588)/28), c%28];
}
function comp(a,b,c){ return String.fromCharCode(BASE + a*588 + b*28 + c); }
function lastSyl(s){ return dec(s.charAt(s.length-1)); }
function hasFinal(s){ var d = lastSyl(s); return !!(d && d[2] > 0); }
function isBright(s){
  for (var i = s.length-1; i >= 0; i--){
    var d = dec(s.charAt(i)); if (!d) continue;
    return d[1] === 0 || d[1] === 8;   /* ㅏ, ㅗ */
  }
  return false;
}

    } else {
      push(stem + (bright ? A : E));                            /* no contraction: 오아요, 마시어요 */
      push(stem + (bright ? E : A));                            /* harmony flipped: 먹아요, 앉어요 */
      var d = lastSyl(stem);
      if (d && d[1] === 18 && d[2] === 0){                       /* ㅡ stem: 바쁘다 → 바빠서 */
        push(stem.slice(0,-1) + comp(d[0], 4, 0) + E.slice(1)); /* 바뻐서 */
        push(stem.slice(0,-1) + comp(d[0], 0, 0) + A.slice(1)); /* 바빠서 / 커요 alt */
      }
    }
  }
  return out;
}

/* ── state ─────────────────────────────────────────────────── */
var FORMLIST = [];
function makeFormList(){
  FORMLIST = DATA.map(function(f){ return { key: f.form, form: f.form, n: toConj([f]).length }; })
                 .filter(function(f){ return f.n > 0; });
}

var mode = "mc", qLen = 10, showHint = true, picked = new Set();
var qs = [], idx = 0, score = 0, missed = [], locked = false;

function $(id){ return document.getElementById(id); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function norm(s){ return String(s).replace(/[\s.?!]/g, ""); }

function buildForms(keepPicked){
  var g = $("formGrid"), keep = new Set(keepPicked ? picked : []); g.innerHTML = ""; picked.clear(); makeFormList();
  FORMLIST.forEach(function(f){
    var b = document.createElement("button");
    b.className = "chip";
    b.innerHTML = esc(formLabel(f.form)) + "<span class='num'>" + f.n + "</span>";
    if (keep.has(f.key)){ picked.add(f.key); b.classList.add("on"); }
    b.onclick = function(){
      if (picked.has(f.key)){ picked.delete(f.key); b.classList.remove("on"); }
      else { picked.add(f.key); b.classList.add("on"); }
      refresh();
    };
    b.setAttribute("data-k", f.key);
    g.appendChild(b);
  });
}
function setAll(on){
  picked.clear();
  var bs = document.querySelectorAll("[data-k]");
  for (var i=0;i<bs.length;i++){
    if (on){ picked.add(bs[i].getAttribute("data-k")); bs[i].classList.add("on"); }
    else bs[i].classList.remove("on");
  }
  refresh();
}
function pool(){ return CONJ.filter(function(c){ return picked.has(c.form); }); }
function refresh(){
  var p = pool();
  if (!picked.size){ $("info").textContent = T("infoNone"); $("startBtn").disabled = true; return; }
  $("info").innerHTML = T(picked.size > 1 ? "infoN" : "info1", { n: picked.size, p: p.length });
  $("startBtn").disabled = false;
}
function seg(boxId, attr, cb){
  var box = $(boxId);
  box.addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if (!b) return;
    var cs = box.querySelectorAll(".chip");
    for (var i=0;i<cs.length;i++) cs[i].classList.remove("on");
    b.classList.add("on"); cb(b.getAttribute(attr));
  });
}

function build(){
  var p = pool();
  var pick = shuffle(p);
  if (pick.length >= qLen) pick = pick.slice(0, qLen);
  else { while (pick.length < qLen && p.length) pick = pick.concat(shuffle(p)); pick = pick.slice(0, qLen); }
  qs = pick.map(function(it){
    var opts = null;
    if (mode === "mc"){
      var w = shuffle(wrongForms(it)).slice(0,2);
      /* same stem in a different form — tests whether the ending itself is known */
      if (w.length < 3){
        var sameStem = shuffle(CONJ.filter(function(c){
          return c.stem === it.stem && c.answer !== it.answer;
        }));
        for (var i=0;i<sameStem.length && w.length<3;i++){
          var a = sameStem[i].answer;
          if (w.indexOf(a) < 0) w.push(a);
        }
      }
      /* still short: fall back to the remaining rule-based forms, then other stems */
      if (w.length < 3){
        var extra = wrongForms(it);
        for (var j=0;j<extra.length && w.length<3;j++) if (w.indexOf(extra[j]) < 0) w.push(extra[j]);
      }
      if (w.length < 3){
        var sameForm = shuffle(CONJ.filter(function(c){ return c.form === it.form && c.answer !== it.answer; }));
        for (var k=0;k<sameForm.length && w.length<3;k++){
          var b = sameForm[k].answer;
          if (w.indexOf(b) < 0) w.push(b);
        }
      }
      opts = shuffle([it.answer].concat(w));
    }
    return { item: it, opts: opts };
  });
}
function start(){
  build(); idx = 0; score = 0; missed = []; results = [];
  $("s-start").style.display = "none"; $("s-done").style.display = "none";
  $("s-quiz").style.display = "block"; render();
}
function render(){
  results[idx] = undefined; recount();
  locked = false;
  var q = qs[idx], it = q.item;
  $("fill").style.width = (idx / qs.length * 100) + "%";
  $("counter").textContent = (idx+1) + " / " + qs.length;
  $("running").textContent = T("correctN", { n: score });
  $("qStem").textContent = it.stem;
  $("qMean").textContent = gloss(it.meaning);
  $("qForm").textContent = formLabel(it.form);
  $("qType").textContent = showHint ? conjNote(it.type) : "";
  $("fb").style.display = "none"; $("fb").className = "fb";
  $("nextBtn").style.display = "none";
  var box = $("opts"), tb = $("typebox");
  if (mode === "mc"){
    tb.style.display = "none"; box.style.display = "grid"; box.innerHTML = "";
    q.opts.forEach(function(o){
      var b = document.createElement("button");
      b.className = "opt"; b.textContent = o;
      b.onclick = function(){ answer(o, b, q); };
      box.appendChild(b);
    });
  } else {
    box.style.display = "none"; box.innerHTML = "";
    tb.style.display = "flex";
    var inp = $("ansInput"); inp.value = ""; inp.disabled = false; inp.focus();
    $("checkBtn").disabled = false;
  }
}
function answer(choice, btn, q){
  if (locked) return; locked = true;
  var good = norm(choice) === norm(q.item.answer);
  if (mode === "mc"){
    var bs = $("opts").querySelectorAll(".opt");
    for (var i=0;i<bs.length;i++){
      bs[i].disabled = true;
      if (bs[i].textContent === q.item.answer) bs[i].classList.add("ok");
      else if (bs[i] === btn && !good) bs[i].classList.add("no");
    }
  } else {
    $("ansInput").disabled = true; $("checkBtn").disabled = true;
  }
  results[idx] = { good: good, rec: { item: q.item, given: choice } }; recount();
  $("running").textContent = T("correctN", { n: score });
  var fb = $("fb"); fb.style.display = "block";
  if (!good) fb.classList.add("bad");
  $("fbT").textContent = good ? T("fbGood") : T("fbBad");
  $("fbM").textContent = q.item.stem + " + " + formLabel(q.item.form) + " → " + q.item.answer;
  var note = conjNote(q.item.type);
  if (!good && mode === "type" && choice) note = T("youWrote", { a: choice }) + "  ·  " + note;
  $("fbE").textContent = note;
  var nb = $("nextBtn"); nb.style.display = "block";
  nb.textContent = idx < qs.length - 1 ? T("next") : T("seeResults");
  nb.focus();
}
function next(){ idx++; if (idx >= qs.length) done(); else render(); }
function done(){
  $("s-quiz").style.display = "none"; $("s-done").style.display = "block";
  $("sN").textContent = score; $("sD").textContent = "/ " + qs.length;
  var pct = score / qs.length, m, s;
  var lv = pct === 1 ? 1 : pct >= .8 ? 2 : pct >= .6 ? 3 : 4; m = T("m" + lv); s = T("s" + lv);
  $("sM").textContent = m; $("sS").textContent = s;
  var box = $("revBox"); box.innerHTML = "";
  if (!missed.length){ box.innerHTML = "<div class='allok'>" + esc(T("allOk")) + "</div>"; return; }
  var t = document.createElement("div");
  t.className = "rev-t"; t.textContent = T("review", { n: missed.length });
  box.appendChild(t);
  missed.forEach(function(w){
    var it = w.item;
    var d = document.createElement("div"); d.className = "rev";
    d.innerHTML = "<div class='rev-k'>" + esc(it.stem) + " + " + esc(formLabel(it.form)) + " → " + esc(it.answer) + "</div>" +
      "<div class='rev-e'>" + esc(gloss(it.meaning)) + " · " + esc(conjNote(it.type)) + "</div>";
    box.appendChild(d);
  });
}

seg("modeSeg", "data-mode", function(v){ mode = v; });
seg("lenSeg", "data-len", function(v){ qLen = Number(v); });
seg("hintSeg", "data-hint", function(v){ showHint = v === "1"; });
$("selAll").onclick = function(){ setAll(true); };
$("selNone").onclick = function(){ setAll(false); };
$("startBtn").onclick = start;
$("nextBtn").onclick = next;
$("againBtn").onclick = start;
$("backBtn").onclick = function(){ $("s-done").style.display="none"; $("s-start").style.display="block"; };
$("checkBtn").onclick = function(){ if (!locked) answer($("ansInput").value.trim(), null, qs[idx]); };
$("ansInput").addEventListener("keydown", function(e){
  if (e.key === "Enter"){ if (!locked) answer($("ansInput").value.trim(), null, qs[idx]); else next(); }
});

var results = [];
function recount(){
  score = 0; missed = [];
  for (var i=0;i<results.length;i++){ var r = results[i]; if (!r) continue; if (r.good) score++; else missed.push(r.rec); }
}
function goBack(){
  try { if (typeof player !== "undefined") player.pause(); } catch(e){}
  if (idx === 0){ goMenu(); return; }
  idx--; render();
}
function goMenu(){
  try { if (typeof player !== "undefined") player.pause(); } catch(e){}
  $("s-quiz").style.display = "none"; $("s-done").style.display = "none"; $("s-start").style.display = "block";
}
$("prevBtn").onclick = goBack;
$("menuBtn").onclick = goMenu;

/* ── 출처 안내 · source note ── */
function showSource(){
  var n = $("srcNote");
  if (SOURCE === "link"){ n.style.display = "block";
    n.textContent = T("srcLink"); }
  else if (SOURCE === "saved"){ n.style.display = "block";
    n.innerHTML = esc(T("srcSaved")) + " <button class='mini' id='useDefault'>" + esc(T("showDefaults")) + "</button>";
    $("useDefault").onclick = function(){ setData(JSON.parse(JSON.stringify(DEFAULT_FORMS)), "default"); refreshAll(); }; }
  else n.style.display = "none";
}
function refreshAll(keepPicked){ buildForms(keepPicked); refresh(); showSource(); }

/* ── 어휘 편집 · word editor ── */
var EDIT = null, editIdx = 0;
function linesOf(f){ return (f.words || []).map(function(w){ return w.join(", ").replace(/(,\s*)+$/, ""); }).join("\n"); }
function parseLines(text){
  var words = [], bad = [];
  text.split(/\r?\n/).forEach(function(line, i){
    var t = line.trim(); if (!t) return;
    var p = t.split(/\s*[,，\t]\s*/);
    if (p.length < 2 || !p[0] || !p[1]) { bad.push((i+1) + ": " + t); return; }
    var w = [p[0], p[1], p[2] || ""]; if (p[3]) w.push(p[3]);
    words.push(w);
  });
  return { words: words, bad: bad };
}
function fillSelect(){
  var s = $("formSel"); s.innerHTML = "";
  EDIT.forEach(function(f, i){
    var o = document.createElement("option"); o.value = i;
    o.textContent = f.form + "  (" + (f.words || []).length + ")"; s.appendChild(o);
  });
  if (editIdx >= EDIT.length) editIdx = EDIT.length - 1;
  s.value = editIdx;
  $("words").value = EDIT.length ? linesOf(EDIT[editIdx]) : "";
  $("words").disabled = !EDIT.length;
}
function keepCurrent(){
  if (!EDIT.length) return true;
  var r = parseLines($("words").value);
  EDIT[editIdx].words = r.words;
  $("editErr").textContent = r.bad.length ? T("skipped", { f: EDIT[editIdx].form }) + "\n" + r.bad.join("\n") : "";
  return !r.bad.length;
}
function openEditor(){
  EDIT = JSON.parse(JSON.stringify(DATA)); editIdx = 0;
  $("editErr").textContent = ""; $("editOk").textContent = ""; $("shareMsg").textContent = "";
  fillSelect();
  $("s-start").style.display = "none"; $("s-edit").style.display = "block";
}
function closeEditor(){ $("s-edit").style.display = "none"; $("s-start").style.display = "block"; }
$("editBtn").onclick = openEditor;
$("formSel").onchange = function(){ keepCurrent(); editIdx = Number(this.value); fillSelect(); };
$("addFormBtn").onclick = function(){ $("newFormRow").style.display = "flex"; $("newFormName").focus(); };
$("newFormCancel").onclick = function(){ $("newFormRow").style.display = "none"; };
$("newFormOk").onclick = function(){
  var name = $("newFormName").value.trim(); if (!name) return;
  keepCurrent();
  var at = -1; EDIT.forEach(function(f, i){ if (f.form === name) at = i; });
  if (at < 0){ EDIT.push({ form: name, words: [] }); at = EDIT.length - 1; }
  editIdx = at; $("newFormName").value = ""; $("newFormRow").style.display = "none"; fillSelect(); $("words").focus();
};
$("delFormBtn").onclick = function(){
  if (!EDIT.length) return;
  var gone = EDIT.splice(editIdx, 1)[0]; editIdx = Math.max(0, editIdx - 1); fillSelect();
  $("editOk").textContent = T("removed", { f: gone.form });
};
function cleaned(){ return EDIT.filter(function(f){ return (f.words || []).length; }); }
$("saveEdit").onclick = function(){
  keepCurrent();
  var forms = cleaned();
  if (!forms.length){ $("editErr").textContent = T("noWords"); return; }
  try { localStorage.setItem(LSKEY, JSON.stringify(forms)); } catch(e){}
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  setData(forms, "saved"); refreshAll(); closeEditor();
};
$("cancelEdit").onclick = closeEditor;
$("resetAll").onclick = function(){
  try { localStorage.removeItem(LSKEY); } catch(e){}
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  EDIT = JSON.parse(JSON.stringify(DEFAULT_FORMS)); editIdx = 0; fillSelect();
  setData(JSON.parse(JSON.stringify(DEFAULT_FORMS)), "default"); refreshAll();
  $("shareMsg").textContent = T("resetDone");
};
$("copyLink").onclick = function(){
  keepCurrent();
  encodeForms(cleaned()).then(function(code){
    /* 한국어 화면으로 만든 링크에는 언어를 넣지 않는다(학생은 기본 언어로 본다) · no language is added when the teacher uses the Korean screen */
    var url = location.origin + location.pathname + (lang === "ko" ? "" : "?lang=" + lang) + "#w=" + code;
    var msg = function(ok){ $("shareMsg").textContent = (ok ? T("linkCopied") : T("copyThis")) +
      (url.length > 6000 ? T("longLink") : "") + (ok ? "" : "\n" + url); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function(){ msg(true); }, function(){ msg(false); });
    else msg(false);
  });
};
$("dlData").onclick = function(){
  keepCurrent();
  var J = function(x){ return JSON.stringify(x); };
  var body = "/* 활용 연습 어휘 · Conjugation quiz words — exported from the quiz page */\nvar FORMS = [\n" +
    cleaned().map(function(f){ return "  { form: " + J(f.form) + ", words: [\n" +
      f.words.map(function(w){ return "      [" + w.map(J).join(", ") + "],"; }).join("\n") + "\n  ]},"; }).join("\n") + "\n];\n";
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([body], { type: "text/javascript" }));
  a.download = "data.js"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
};

loadData().then(function(){ refreshAll(); initLang(function(){ refreshAll(true); }); });
